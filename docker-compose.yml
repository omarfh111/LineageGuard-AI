services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/lineageguard.db}
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL:-http://host.docker.internal:8080}
      DATAHUB_GMS_TOKEN: ${DATAHUB_GMS_TOKEN:-}
      DATAHUB_MUTATIONS_ENABLED: "false"
      TOOLS_IS_MUTATION_ENABLED: "false"
      DATAHUB_MCP_DOCUMENT_TOOLS_DISABLED: "true"
      DATAHUB_WRITEBACK_ENABLED: ${DATAHUB_WRITEBACK_ENABLED:-false}
      WRITEBACK_STALE_SECONDS: ${WRITEBACK_STALE_SECONDS:-300}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_JUDGE_MODEL: ${OPENAI_JUDGE_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_JUDGE_MODEL: ${GROQ_JUDGE_MODEL:-}
      JUDGE_TEMPERATURE: ${JUDGE_TEMPERATURE:-0}
      JUDGE_TIMEOUT_SECONDS: ${JUDGE_TIMEOUT_SECONDS:-30}
      JUDGE_MAX_RETRIES: ${JUDGE_MAX_RETRIES:-1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_CRITIC_MODEL: ${NVIDIA_CRITIC_MODEL:-}
      NVIDIA_TIMEOUT_SECONDS: ${NVIDIA_TIMEOUT_SECONDS:-90}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-}
      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT:-}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-lineageguard_datahub}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-openai}
      RAG_MAX_ASSETS: ${RAG_MAX_ASSETS:-1500}
      CATALOG_AUTOLOAD: ${CATALOG_AUTOLOAD:-true}
      CATALOG_REFRESH_SECONDS: ${CATALOG_REFRESH_SECONDS:-60}
      CATALOG_MAX_ASSETS: ${CATALOG_MAX_ASSETS:-1500}
      CATALOG_MAX_EDGES: ${CATALOG_MAX_EDGES:-5000}
      CATALOG_LINEAGE_CONCURRENCY: ${CATALOG_LINEAGE_CONCURRENCY:-8}
      CHAT_MEMORY_ENABLED: ${CHAT_MEMORY_ENABLED:-true}
      CHAT_MEMORY_MAX_TURNS: ${CHAT_MEMORY_MAX_TURNS:-6}
      CHAT_MEMORY_CONTEXT_CHARS: ${CHAT_MEMORY_CONTEXT_CHARS:-6000}
      CHAT_MEMORY_TTL_HOURS: ${CHAT_MEMORY_TTL_HOURS:-168}
      DEMO_MODE: ${DEMO_MODE:-false}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-${OPENAI_JUDGE_MODEL:-}}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-15}
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - lineageguard-backend-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
    volumes:
      - lineageguard-qdrant-data:/qdrant/storage
    healthcheck:
      # The minimal Qdrant image does not ship wget or curl. Bash's TCP probe
      # confirms that the REST listener is accepting connections before the API starts.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  lineageguard-backend-data:
  lineageguard-qdrant-data:
