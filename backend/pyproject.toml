[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lineageguard-ai-backend"
version = "0.1.0"
description = "LineageGuard AI API bootstrap"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "mcp>=1.20,<2.0",
  "mcp-server-datahub>=0.6,<0.7",
  "openai>=2.0,<3.0",
  "groq>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langsmith>=0.3,<1.0",
  "qdrant-client>=1.12,<2.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires running LineageGuard and local DataHub containers",
]

[tool.setuptools.packages.find]
include = ["app*"]
